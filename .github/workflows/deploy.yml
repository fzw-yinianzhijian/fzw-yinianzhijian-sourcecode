name: deploy

on:
  # 每当 push 到 main 分支时触发部署
  # Deployment is triggered whenever a push is made to the main branch.
  push:
    branches: [main]
  # 手动触发部署
  # Manually trigger deployment
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          # "Last updated time" and other git log-related information require fetching all commit records.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 选择要使用的 node 版本
          node-version: 22


      # 安装依赖
      # Install dependencies
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile


      # 运行构建脚本
      # Run the build script
      - name: Build VuePress site
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run docs:build


      # 部署到目标仓库的 main 分支根目录
      # Deploy to the main branch root directory of the target repository
      - name: Deploy to GitHub Pages
        run: |
          cd docs/.vuepress/dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git remote add origin https://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@github.com/fzw-yinianzhijian/fzw-yinianzhijian.github.io.git
          git push -f origin main
